name: Deploy Supabase edge functions

# Deploys ai-tutor, ai-assessor and run-python to Supabase.
# Runs when function code changes on main, or manually from the Actions tab
# ("Run workflow"). Needs two repository secrets (Settings → Secrets and
# variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_REF   the project ref (the id in https://<ref>.supabase.co)
# Function settings such as verify_jwt come from supabase/config.toml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy functions
        run: |
          # Accept the ref with stray spaces/newlines, or a pasted dashboard or project URL.
          REF=$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '[:space:]' \
            | sed -E 's#^https?://##; s#^supabase\.com/dashboard/project/##; s#\.supabase\.co.*$##; s#/.*$##')
          if ! printf '%s' "$REF" | grep -Eq '^[a-z]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF must be the 20-letter project ID (Supabase → Project Settings → General → Project ID). The current value has ${#REF} characters after cleanup."
            exit 1
          fi
          npx -y supabase@2.120.0 functions deploy ai-tutor ai-assessor run-python --project-ref "$REF" --use-api
